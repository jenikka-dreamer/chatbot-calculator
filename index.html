<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор чат-ботів</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html{background:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background-color:#ffffff;background-image:radial-gradient(circle,#c0bdb4 1.5px,transparent 1.5px);background-size:20px 20px;color:#1c1c1e;min-height:100vh;padding:0 0 40px}
.top-bar{background:#F5C842;padding:16px 18px 14px;position:sticky;top:0;z-index:10}
.top-title{font-size:17px;font-weight:700;color:#1c1200;letter-spacing:-.3px}
.top-sub{font-size:12px;color:#5a4800;margin-top:1px}
.content{padding:18px 16px 0}
.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#8e8e93;margin:20px 0 8px}
.scard{background:rgba(255,255,255,0.75);border:1.5px solid #e5e5ea;border-radius:14px;padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s;backdrop-filter:blur(4px)}
.scard.on{border-color:#F5C842;background:rgba(255,253,232,0.88)}
.badge-hl{display:inline-block;background:#F5C842;color:#3a2c00;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-bottom:6px}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ct{font-size:15px;font-weight:700;color:#1c1c1e;line-height:1.2}
.cp{font-size:13px;color:#8e8e93;white-space:nowrap;margin-top:2px;font-weight:500}
.cd{font-size:12px;color:#8e8e93;margin-top:5px;line-height:1.4}
.tip{font-size:11px;color:#7a6500;background:rgba(255,253,232,0.9);border:1px solid #F5C842;border-radius:8px;padding:5px 9px;margin-top:7px;line-height:1.4}
.extras-bg{background:rgba(255,255,255,0.65);border:1.5px solid #e5e5ea;border-radius:16px;overflow:hidden;backdrop-filter:blur(4px)}
.ei{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(242,242,247,0.9);cursor:pointer;transition:background .1s}
.ei:last-child{border-bottom:none}
.ei.on{background:rgba(255,253,232,0.85)}
.round-cb{width:22px;height:22px;border-radius:50%;border:2px solid #d1d1d6;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:#fff;margin-top:1px}
.round-cb.checked{background:#F5C842;border-color:#F5C842}
.round-cb.checked::after{content:'';width:5px;height:9px;border:2px solid #1c1200;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);display:block}
.ei-info{flex:1}
.en{font-size:14px;font-weight:600;color:#1c1c1e;line-height:1.3}
.ep{font-size:12px;color:#8e8e93;margin-top:2px}
.ehint{font-size:11px;color:#b38a00;margin-top:3px;line-height:1.4}
.bonus-box{background:rgba(255,253,232,0.75);border:1.5px solid #F5C842;border-radius:14px;padding:13px 15px;margin-top:4px;backdrop-filter:blur(4px)}
.bonus-title{font-size:14px;font-weight:700;color:#1c1200}
.bonus-desc{font-size:12px;color:#7a6500;margin-top:4px;line-height:1.5}
.disclaimer{background:rgba(255,255,255,0.55);border:1px solid #e5e5ea;border-radius:12px;padding:12px 14px;margin-top:16px;backdrop-filter:blur(4px)}
.disclaimer p{font-size:11px;color:#8e8e93;line-height:1.6}
.disclaimer strong{color:#5a5040;font-weight:600}
.res{background:rgba(255,255,255,0.8);border:2px solid #F5C842;border-radius:16px;padding:16px;margin-top:20px;display:none;backdrop-filter:blur(4px)}
.rl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#8e8e93;margin-bottom:4px}
.rp{font-size:34px;font-weight:800;color:#1c1c1e;letter-spacing:-1px;line-height:1}
.rp span{font-size:16px;font-weight:500;color:#8e8e93;margin-left:4px}
.bd{margin-top:12px;border-top:1px solid #f2f2f7;padding-top:10px}
.br{display:flex;justify-content:space-between;font-size:13px;color:#3a3a3c;margin-bottom:5px}
.br.tot{font-weight:800;color:#1c1c1e;border-top:1px solid #f2f2f7;margin-top:6px;padding-top:8px;font-size:14px}
.rn{font-size:11px;color:#aeaeb2;margin-top:10px;line-height:1.6}
.calc-btn{display:block;margin:16px auto 0;padding:12px 40px;background:#F5C842;color:#1c1200;border:none;border-radius:50px;font-size:15px;font-weight:800;cursor:pointer;transition:background .15s,transform .1s}
.calc-btn:active{background:#e0b530;transform:scale(.97)}
.close-btn{display:block;width:100%;margin-top:14px;padding:13px;background:#1c1c1e;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.rst-btn{display:block;margin:10px auto 0;padding:9px 28px;background:transparent;color:#8e8e93;border:1.5px solid #e5e5ea;border-radius:50px;font-size:13px;font-weight:600;cursor:pointer}
.saving{font-size:12px;color:#8e8e93;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="top-bar">
  <div class="top-title">Калькулятор чат-ботів</div>
  <div class="top-sub">Попередній розрахунок вартості вашого проєкту</div>
</div>
<div class="content">
<div class="lbl">Тип бота</div>
<div id="sv"></div>
<div class="lbl">Додаткові опції</div>
<div class="extras-bg"><div id="ex"></div></div>
<div class="lbl">Бонус — завжди включено</div>
<div class="bonus-box">
  <div class="bonus-title">Технічна підтримка</div>
  <div class="bonus-desc">Залишаюся з вами після здачі бота. Завжди на зв'язку
