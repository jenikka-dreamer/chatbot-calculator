<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Service Calc</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --dots: #e5e5e5;
            --graphite: #333333;
            --soft-yellow: #F9D949; /* Більш спокійний жовтий */
            --border: #eeeeee;
            --gray-text: #888888;
        }

        body {
            font-family: -apple-system, "Helvetica Neue", sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(var(--dots) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--graphite);
            margin: 0; padding: 20px;
            font-weight: 300;
            line-height: 1.4;
        }

        .header { margin-bottom: 25px; text-align: left; }
        .header h1 { font-size: 22px; font-weight: 500; margin: 0; }
        .header p { font-size: 13px; color: var(--gray-text); margin-top: 4px; }

        .section-title { 
            font-size: 10px; font-weight: 700; color: #bbb; 
            text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px;
        }

        /* Список основних послуг */
        .list-main { display: flex; flex-direction: column; gap: 8px; }
        .card {
            background: #fff;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: 0.2s;
        }
        .card.active {
            border-color: var(--soft-yellow);
            background: #fffdf5;
        }
        .card h3 { margin: 0; font-size: 15px; font-weight: 400; display: flex; align-items: center; gap: 6px; }
        .price-label { font-size: 14px; font-weight: 500; }

        .info-btn {
            width: 16px; height: 16px; border-radius: 50%; border: 1px solid #ddd;
            font-size: 10px; display: inline-flex; align-items: center; justify-content: center;
            color: #ccc; cursor: pointer;
        }

        /* Єдиний блок чекбоксів */
        .options-block {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 5px 0;
            display: flex;
            flex-direction: column;
        }
        .check-item {
            padding: 12px 18px;
            display: flex; align-items: center; gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }
        .check-item:last-child { border-bottom: none; }
        .check-item input { display: none; }

        .custom-check {
            width: 18px; height: 18px; border-radius: 50%;
            border: 1px solid #ddd; position: relative; flex-shrink: 0;
        }
        .check-item input:checked + .custom-check {
            background: var(--soft-yellow);
            border-color: var(--soft-yellow);
        }
        .check-item input:checked + .custom-check::after {
            content: ''; position: absolute; top: 6px; left: 6px;
            width: 6px; height: 6px; border-radius: 50%; background: #333;
        }

        .check-text { font-size: 13px; flex-grow: 1; }
        .check-price { font-size: 11px; color: var(--gray-text); }

        /* Summary */
        .summary {
            margin-top: 30px;
            text-align: center;
            padding-bottom: 40px;
        }
        .total-val { font-size: 28px; font-weight: 300; margin: 5px 0; }
        .bonus-text { font-size: 11px; color: #999; margin-bottom: 15px; }

        /* Маленька кнопка */
        .btn-send {
            background: var(--soft-yellow);
            color: var(--graphite);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .btn-send:active { transform: scale(0.96); opacity: 0.8; }

        /* Modal */
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #fff; padding: 20px; border-radius: 15px;
            width: 80%; display: none; z-index: 1000; border: 1px solid #eee;
        }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.7); display: none; z-index: 999; backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Розрахунок вартості</h1>
        <p>Налаштуйте параметри вашого бота</p>
    </div>

    <div class="section-title">Тип чат-бота</div>
    <div class="list-main">
        <div class="card active" data-price="2000" data-name="Insta-бот (тригери)" onclick="select(this)">
            <h3>Insta-бот (тригери) <span class="info-btn" onclick="tip(event, 'Автовідповіді на сторіз, коментарі та ключові слова в Direct.')">?</span></h3>
            <div class="price-label">2 000 ₴</div>
        </div>
        <div class="card" data-price="2500" data-name="Воронка лід-магніт" onclick="select(this)">
            <h3>Воронка лід-магніт <span class="info-btn" onclick="tip(event, 'Проста система для видачі файлу або лінку за підписку.')">?</span></h3>
            <div class="price-label">2 500 ₴</div>
        </div>
        <div class="card" data-price="5000" data-name="Бот-візитка / Каталог" onclick="select(this)">
            <h3>Бот-візитка / Каталог</h3>
            <div class="price-label">5 000 ₴</div>
        </div>
        <div class="card" data-price="5000" data-name="Запис / Консультація" onclick="select(this)">
            <h3>Запис на консультацію</h3>
            <div class="price-label">5 000 ₴</div>
        </div>
        <div class="card" data-price="7000" data-name="Курс / Марафон / Клуб" onclick="select(this)">
            <h3>Курс / Марафон / Клуб</h3>
            <div class="price-label">7 000 ₴</div>
        </div>
    </div>

    <div class="section-title">Додаткові опції</div>
    <div class="options-block">
        <label class="check-item">
            <input type="checkbox" data-price="1500" data-name="Тригери в Instagram" onchange="calc()">
            <div class="custom-check"></div>
            <div class="check-text">Додаткові тригери Insta</div>
            <div class="check-price">+1500 ₴</div>
        </label>
        <label class="check-item">
            <input type="checkbox" data-price="2000" data-name="Тести / Квізи" onchange="calc()">
            <div class="custom-check"></div>
            <div class="check-text">Тести / Квізи / Гейміфікація</div>
            <div class="check-price">+2000 ₴</div>
        </label>
        <label class="check-item">
            <input type="checkbox" data-price="1500" data-name="Ідеї та стратегія" onchange="calc()">
            <div class="custom-check"></div>
            <div class="check-text">Розробка ідей та стратегії</div>
            <div class="check-price">+1500 ₴</div>
        </label>
        <label class="check-item">
            <input type="checkbox" data-price="1000" data-name="Прийом оплат" onchange="calc()">
            <div class="custom-check"></div>
            <div class="check-text">Прийом оплат (WFP/Stripe)</div>
            <div class="check-price">+1000 ₴</div>
        </label>
        <label class="check-item">
            <input type="checkbox" data-price="700" data-name="Дизайн Canva" onchange="calc()">
            <div class="custom-check"></div>
            <div class="check-text">Дизайн у Canva</div>
            <div class="check-price">+700 ₴</div>
        </label>
        <label class="check-item">
            <input type="checkbox" data-price="600" data-name="Тексти" onchange="calc()">
            <div class="custom-check"></div>
            <div class="check-text">Копірайтинг (тексти)</div>
            <div class="check-price">+600 ₴</div>
        </label>
        <label class="check-item">
            <input type="checkbox" data-price="3000" data-name="Mini App" onchange="calc()">
            <div class="custom-check"></div>
            <div class="check-text">Telegram Mini App</div>
            <div class="check-price">+3000 ₴</div>
        </label>
    </div>

    <div class="summary">
        <div style="font-size: 11px; color: #999; text-transform: uppercase;">Сума від:</div>
        <div class="total-val"><span id="res">2000</span> ₴</div>
        <div class="bonus-text">Включено техпідтримку (1 міс.)</div>
        <button class="btn-send" onclick="send()">Надіслати замовлення</button>
    </div>

    <div class="modal-overlay" id="overlay" onclick="closeTip()"></div>
    <div class="modal" id="modal">
        <p id="modalText" style="font-size: 14px; color: #444; line-height: 1.5;"></p>
        <button onclick="closeTip()" style="border:none; background:var(--soft-yellow); padding:8px 15px; border-radius:10px; width:100%; margin-top:10px; font-weight:600;">Ок</button>
    </div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    function select(el) {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        calc();
    }

    function calc() {
        let base = parseInt(document.querySelector('.card.active').dataset.price);
        let extra = 0;
        document.querySelectorAll('input[type="checkbox"]:checked').forEach(c => {
            extra += parseInt(c.dataset.price);
        });
        document.getElementById('res').innerText = (base + extra).toLocaleString();
    }

    function tip(e, text) {
        e.stopPropagation();
        document.getElementById('modalText').innerText = text;
        document.getElementById('modal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    function closeTip() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    function send() {
        let service = document.querySelector('.card.active').dataset.name;
        let opts = [];
        document.querySelectorAll('input[type="checkbox"]:checked').forEach(c => opts.push(c.dataset.name));
        
        let result = {
            project: service,
            modules: opts,
            total: document.getElementById('res').innerText + " грн"
        };
        tg.sendData(JSON.stringify(result));
    }
</script>
</body>
</html>
