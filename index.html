<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Калькулятор чат-ботів</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html{background:#ffffff}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background-color:#ffffff;background-image:radial-gradient(circle,#c0bdb4 1.5px,transparent 1.5px);background-size:20px 20px;color:#1c1c1e;min-height:100vh;padding:0 0 40px;-webkit-font-smoothing:antialiased;}.top-bar{background:#F5C842;padding:16px 18px 14px;position:sticky;top:0;z-index:10}.top-title{font-size:17px;font-weight:700;color:#1c1200;letter-spacing:-.3px}.top-sub{font-size:12px;color:#5a4800;margin-top:1px}.content{padding:18px 16px 0}.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#8e8e93;margin:20px 0 8px}.scard{background:rgba(255,255,255,0.75);border:1.5px solid #e5e5ea;border-radius:14px;padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s;backdrop-filter:blur(4px)}.scard.on{border-color:#F5C842;background:rgba(255,253,232,0.88)}.badge-hl{display:inline-block;background:#F5C842;color:#3a2c00;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-bottom:6px}.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.ct{font-size:15px;font-weight:700;color:#1c1c1e;line-height:1.2}.cp{font-size:13px;color:#8e8e93;white-space:nowrap;margin-top:2px;font-weight:500}.cd{font-size:12px;color:#8e8e93;margin-top:5px;line-height:1.4}.tip{font-size:11px;color:#7a6500;background:rgba(255,253,232,0.9);border:1px solid #F5C842;border-radius:8px;padding:5px 9px;margin-top:7px;line-height:1.4}.extras-bg{background:rgba(255,255,255,0.65);border:1.5px solid #e5e5ea;border-radius:16px;overflow:hidden;backdrop-filter:blur(4px)}.ei{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(242,242,247,0.9);cursor:pointer;transition:background .1s}.ei:last-child{border-bottom:none}.ei.on{background:rgba(255,253,232,0.85)}.round-cb{width:22px;height:22px;border-radius:50%;border:2px solid #d1d1d6;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:#fff;margin-top:1px}.round-cb.checked{background:#F5C842;border-color:#F5C842}.round-cb.checked::after{content:'';width:5px;height:9px;border:2px solid #1c1200;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);display:block}.ei-info{flex:1}.en{font-size:14px;font-weight:600;color:#1c1c1e;line-height:1.3}.ep{font-size:12px;color:#8e8e93;margin-top:2px}.ehint{font-size:11px;color:#b38a00;margin-top:3px;line-height:1.4}.bonus-box{background:rgba(255,253,232,0.75);border:1.5px solid #F5C842;border-radius:14px;padding:13px 15px;margin-top:4px;backdrop-filter:blur(4px)}.res{background:rgba(255,255,255,0.8);border:2px solid #F5C842;border-radius:16px;padding:16px;margin-top:20px;display:none;backdrop-filter:blur(4px)}.rp{font-size:34px;font-weight:800;color:#1c1c1e;letter-spacing:-1px}.bd{margin-top:12px;border-top:1px solid #f2f2f7;padding-top:10px}.br{display:flex;justify-content:space-between;font-size:13px;color:#3a3a3c;margin-bottom:5px}.br.tot{font-weight:800;color:#1c1c1e;border-top:1px solid #f2f2f7;margin-top:6px;padding-top:8px}.calc-btn{display:block;margin:16px auto 0;padding:12px 40px;background:#F5C842;color:#1c1200;border:none;border-radius:50px;font-size:15px;font-weight:800;cursor:pointer}.close-btn{display:block;width:100%;margin-top:14px;padding:13px;background:#1c1c1e;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700}.rst-btn{display:block;margin:10px auto 0;padding:9px 28px;background:transparent;color:#8e8e93;border:1.5px solid #e5e5ea;border-radius:50px;font-size:13px;font-weight:600;cursor:pointer}.saving{font-size:12px;color:#8e8e93;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="top-bar">
  <div class="top-title">Калькулятор чат-ботів</div>
  <div class="top-sub">Попередній розрахунок вартості вашого проєкту</div>
</div>
<div class="content">
<div class="lbl">Тип бота</div><div id="sv"></div>
<div class="lbl">Додаткові опції</div><div class="extras-bg"><div id="ex"></div></div>
<div class="lbl">Бонус — завжди включено</div>
<div class="bonus-box">
  <div class="bonus-title">Технічна підтримка</div>
  <div class="bonus-desc">Залишаюся з вами після здачі бота. Завжди на зв'язку — допоможу вирішити будь-яке питання. Не залишаю вас наодинці.</div>
</div>
<div class="res" id="res">
  <div class="rp" id="rp">0<span>грн</span></div>
  <div class="bd" id="bd"></div>
  <button class="close-btn" id="closeBtn" onclick="saveAndClose()">Зберегти розрахунок</button>
  <div class="saving" id="savingText"></div>
</div>
<button class="calc-btn" onclick="calc()">Порахувати</button>
<button class="rst-btn" onclick="rst()">Скинути</button>
</div>

<script>
var tg=window.Telegram.WebApp; tg.expand();

// ВСТАВТЕ ВАШЕ ПОСИЛАННЯ /EXEC ТУТ
var GOOGLE_URL = "https://script.google.com/macros/s/AKfycbwVCdU35VvwVYZxI2pN1_4EaNjCI9u4xh2t4cZhWMTsPIamIx7V6QMO99hNo0wq-St0/exec";

var SV=[
  {id:'base',name:'Бот-база',base:2000,desc:'Основа під будь-яку задачу.',tip:'Для тесту, тригера або простої автоматизації.'},
  {id:'ig_lead',name:'Лід-магніт в Instagram',base:2000,desc:'Видача подарунку через Instagram.',tip:'Реакція на коментарі або сторіз.'},
  {id:'funnel',name:'Воронка лід-магнітна',base:3000,desc:'Збір лідів + прогрів + перехід у Telegram.',tip:'Повна автоворонка з переведенням клієнта в ТГ.'},
  {id:'card',name:'Бот-візитка',base:5000,desc:'Презентація бізнесу з контентом.',tip:'Замінює сайт всередині месенджера.'},
  {id:'catalog',name:'Каталог',base:5000,desc:'Товари або послуги.',tip:'Вітрина в боті.'},
  {id:'course',name:'Бот-курс',base:6000,desc:'Навчальні матеріали та тести.',tip:'Автоматична видача уроків по кроках.'},
];
var EX=[
  {id:'design',label:'Дизайн у Canva / макет',price:500,hint:'Оформлення карток, банерів'},
  {id:'copy',label:'Написання текстів',price:700},
  {id:'google',label:'Інтеграція з Google Таблицями',price:1000},
  {id:'payment',label:'Оплата в боті',price:1000},
  {id:'triggers',label:'Тригери та автоматизація',price:500},
  {id:'game',label:'Тест / рулетка / гейміфікація',price:1500},
];
var sel=null,chk={},calcTotal=0;
function rs(){document.getElementById('sv').innerHTML=SV.map(function(s){var on=sel===s.id;return '<div class="scard'+(on?' on':'')+'" onclick="ss(\''+s.id+'\')">'+(on?'<div class="badge-hl">Обрано</div>':'')+'<div class="ch"><span class="ct">'+s.name+'</span><span class="cp">від '+s.base.toLocaleString('uk-UA')+' грн</span></div><div class="cd">'+s.desc+'</div>'+(on?'<div class="tip">'+s.tip+'</div>':'')+'</div>';}).join('');}
function re(){document.getElementById('ex').innerHTML=EX.map(function(e){var c=chk[e.id];return '<div class="ei'+(c?' on':'')+'" onclick="te(\''+e.id+'\')">'+'<div class="round-cb'+(c?' checked':'')+'"></div>'+'<div class="ei-info"><div class="en">'+e.label+'</div><div class="ep">від '+e.price.toLocaleString('uk-UA')+' грн</div></div></div>';}).join('');}
function ss(id){sel=id;rs();}
function te(id){chk[id]=!chk[id];re();}
function calc(){if(!sel){alert('Оберіть тип бота');return;}var s=SV.find(function(x){return x.id===sel;});calcTotal=s.base;EX.forEach(function(e){if(chk[e.id]){calcTotal+=e.price;}});document.getElementById('rp').innerHTML=calcTotal.toLocaleString('uk-UA')+'<span>грн</span>';document.getElementById('res').style.display='block';}

async function saveAndClose() {
  const btn = document.getElementById('closeBtn'); btn.disabled = true;
  document.getElementById('savingText').textContent = 'Надсилаємо дані...';
  const s = SV.find(x => x.id === sel);
  const extras = Object.keys(chk).filter(k => chk[k]).map(k => EX.find(e => e.id === k).label);
  const userId = tg.initDataUnsafe.user ? String(tg.initDataUnsafe.user.id) : null;

  try {
    // Відправляємо в Google без очікування складної відповіді
    fetch(GOOGLE_URL, {
      method: 'POST',
      mode: 'no-cors', 
      body: JSON.stringify({
        user_id: userId,
        project: s.name,
        options: extras.join(', ') || 'немає',
        price: calcTotal.toLocaleString('uk-UA') + ' грн'
      })
    });
    setTimeout(() => { tg.close(); }, 600);
  } catch(err) {
    tg.close();
  }
}
function rst(){sel=null;chk={};calcTotal=0;rs();re();document.getElementById('res').style.display='none';}
rs();re();
</script>
</body>
</html>
