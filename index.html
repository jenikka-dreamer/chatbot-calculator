<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Бот Калькулятор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #FDFBF7; /* Молочний */
            --yellow: #FFD54F; /* Сонячний */
            --dark: #333;
            --gray: #888;
        }

        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--dark);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; gap: 20px;
        }

        h2 { font-size: 18px; text-align: center; margin: 0; }

        /* Компактні кнопки платформ */
        .platforms { display: flex; justify-content: space-around; gap: 8px; }
        .p-btn { 
            flex: 1; padding: 10px 5px; background: #fff; border: 1px solid #ddd; 
            border-radius: 12px; font-size: 12px; text-align: center; cursor: pointer;
        }
        .p-btn.active { background: var(--yellow); border-color: var(--yellow); font-weight: bold; }

        /* Випадаючий список замість карток */
        select {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #ddd;
            font-size: 16px; background: #fff; outline: none;
        }

        /* Опції маленькими рядками */
        .options { display: flex; flex-direction: column; gap: 10px; }
        .opt { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--yellow); }

        /* Підсумок */
        .total-box {
            margin-top: 10px; padding: 20px; background: #fff; 
            border-radius: 20px; border: 2px solid var(--yellow); text-align: center;
        }
        .price { font-size: 28px; font-weight: 800; margin: 5px 0; }
        .bonus { font-size: 12px; color: green; font-weight: 600; }

        .btn-send {
            background: var(--yellow); border: none; width: 100%; padding: 16px;
            border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>☀️ Розрахунок вартості</h2>

    <!-- 1. Платформи -->
    <div class="platforms">
        <div class="p-btn active" onclick="this.classList.toggle('active'); calc()">TG</div>
        <div class="p-btn" onclick="this.classList.toggle('active'); calc()">Insta</div>
        <div class="p-btn" onclick="this.classList.toggle('active'); calc()">FB</div>
        <div class="p-btn" onclick="this.classList.toggle('active'); calc()">TikTok</div>
    </div>

    <!-- 2. Основна послуга -->
    <select id="mainService" onchange="calc()">
        <option value="5000">Бот-візитка (від 5000 грн)</option>
        <option value="2500">Воронка лід-магніт (від 2500 грн)</option>
        <option value="5000">Бот для запису (від 5000 грн)</option>
        <option value="6000">Каталог послуг (від 6000 грн)</option>
        <option value="8000">Магазин з кошиком (від 8000 грн)</option>
        <option value="5000">Закритий клуб (від 5000 грн)</option>
    </select>

    <!-- 3. Додатково (Тільки найважливіше) -->
    <div class="options">
        <label class="opt"><input type="checkbox" value="2000" onchange="calc()"> Гейміфікація (+2000)</label>
        <label class="opt"><input type="checkbox" value="1000" onchange="calc()"> Рандомна карта / Мотивація (+1000)</label>
        <label class="opt"><input type="checkbox" value="1000" onchange="calc()"> Оплата в боті (+1000)</label>
        <label class="opt"><input type="checkbox" value="3000" onchange="calc()"> Telegram Mini App (+3000)</label>
    </div>

    <!-- 4. Разом -->
    <div class="total-box">
        <div style="font-size: 14px; color: var(--gray);">Орієнтовна вартість:</div>
        <div class="price"><span id="res">5000</span> грн</div>
        <div class="bonus">🎁 Техпідтримка 1 міс. у подарунок</div>
    </div>

    <button class="btn-send" onclick="send()">Надіслати замовлення</button>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    function calc() {
        let base = parseInt(document.getElementById('mainService').value);
        let extra = 0;
        document.querySelectorAll('input[type="checkbox"]:checked').forEach(c => {
            extra += parseInt(c.value);
        });
        document.getElementById('res').innerText = (base + extra).toLocaleString();
    }

    function send() {
        let platforms = [];
        document.querySelectorAll('.p-btn.active').forEach(b => platforms.push(b.innerText));
        
        let data = {
            service: document.getElementById('mainService').options[document.getElementById('mainService').selectedIndex].text,
            platforms: platforms.join(', '),
            total: document.getElementById('res').innerText + " грн"
        };
        
        tg.sendData(JSON.stringify(data));
    }
</script>
</body>
</html>
