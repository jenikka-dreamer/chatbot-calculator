<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Service Calc</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --dots: #e0e0e0;
            --graphite: #333333;
            --soft-yellow: #FFD600;
            --border: #eeeeee;
            --text-dim: #888888;
        }

        /* Фон - білий папір у крапку */
        body {
            font-family: -apple-system, "Helvetica Neue", sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(var(--dots) 1px, transparent 1px);
            background-size: 22px 22px;
            color: var(--graphite);
            margin: 0; padding: 20px;
            font-weight: 300;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        .header { margin-bottom: 25px; }
        .header h1 { font-size: 20px; font-weight: 500; margin: 0; color: var(--graphite); }
        .header p { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

        .section-title { 
            font-size: 10px; font-weight: 700; color: #bbb; 
            text-transform: uppercase; letter-spacing: 1px; margin: 25px 0 12px;
        }

        /* Картки основних типів */
        .grid-base { display: flex; flex-direction: column; gap: 8px; }
        .card {
            background: #fff;
            padding: 15px 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: 0.2s;
        }
        .card.active {
            border-color: var(--soft-yellow);
            box-shadow: 0 0 0 1px var(--soft-yellow); /* Тонке виділення */
        }
        .card h3 { margin: 0; font-size: 15px; font-weight: 400; }
        .price-label { font-size: 14px; font-weight: 500; color: var(--graphite); }

        /* Додаткові опції у два стовпчики */
        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .check-item {
            background: #fff;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; transition: 0.2s;
        }
        .check-item.active {
            border-color: var(--soft-yellow);
            box-shadow: 0 0 0 1px var(--soft-yellow);
        }
        .check-item input { display: none; }

        /* Маленька кругла позначка замість чекбокса */
        .dot {
            width: 12px; height: 12px; border-radius: 50%;
            border: 1px solid #ddd; flex-shrink: 0;
            transition: 0.2s;
        }
        .check-item.active .dot {
            background: var(--soft-yellow);
            border-color: var(--soft-yellow);
        }

        .check-text { font-size: 12px; font-weight: 400; color: var(--graphite); line-height: 1.2; }
        .check-price { display: block; font-size: 10px; color: var(--text-dim); margin-top: 2px; }

        /* Summary */
        .summary {
            margin-top: 35px;
            text-align: center;
            padding-bottom: 50px;
        }
        .total-val { font-size: 28px; font-weight: 300; margin-bottom: 20px; }

        /* Компактна маленька кнопка */
        .btn-action {
            background: var(--soft-yellow);
            color: var(--graphite);
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
            transition: 0.2s;
        }
        .btn-action:active { opacity: 0.7; transform: scale(0.96); }

        /* Modal підказки */
        #modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #fff; padding: 20px; border-radius: 15px; width: 80%;
            display: none; z-index: 1000; border: 1px solid #eee; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; z-index: 999; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Розрахунок послуг</h1>
        <p>Оберіть базу та необхідні розширення</p>
    </div>

    <div class="section-title">Основний тип</div>
    <div class="grid-base">
        <div class="card active" data-price="2000" data-name="Бот-база" onclick="selectCard(this)">
            <h3>Бот-база (фундамент)</h3>
            <div class="price-label">2 000 ₴</div>
        </div>
        <div class="card" data-price="2500" data-name="Воронка лід-магніт" onclick="selectCard(this)">
            <h3>Воронка лід-магніт</h3>
            <div class="price-label">2 500 ₴</div>
        </div>
        <div class="card" data-price="5000" data-name="Бот-візитка / Каталог" onclick="selectCard(this)">
            <h3>Бот-візитка / Каталог</h3>
            <div class="price-label">5 000 ₴</div>
        </div>
        <div class="card" data-price="5000" data-name="Запис на консультацію" onclick="selectCard(this)">
            <h3>Запис / Консультація</h3>
            <div class="price-label">5 000 ₴</div>
        </div>
    </div>

    <div class="section-title">Додаткові модулі</div>
    <div class="checkbox-grid">
        <label class="check-item" onclick="toggleCheck(this)">
            <input type="checkbox" data-price="2000" data-name="Тести/Квізи">
            <div class="dot"></div>
            <div class="check-text">Тести / Квізи<span class="check-price">+2 000 ₴</span></div>
        </label>
        <label class="check-item" onclick="toggleCheck(this)">
            <input type="checkbox" data-price="1500" data-name="Insta-тригери">
            <div class="dot"></div>
            <div class="check-text">Insta-тригери<span class="check-price">+1 500 ₴</span></div>
        </label>
        <label class="check-item" onclick="toggleCheck(this)">
            <input type="checkbox" data-price="1000" data-name="Оплата">
            <div class="dot"></div>
            <div class="check-text">Stripe / Mono<span class="check-price">+1 000 ₴</span></div>
        </label>
        <label class="check-item" onclick="toggleCheck(this)">
            <input type="checkbox" data-price="1500" data-name="Стратегія">
            <div class="dot"></div>
            <div class="check-text">Ідеї/Стратегія<span class="check-price">+1 500 ₴</span></div>
        </label>
        <label class="check-item" onclick="toggleCheck(this)">
            <input type="checkbox" data-price="700" data-name="Дизайн Canva">
            <div class="dot"></div>
            <div class="check-text">Дизайн Canva<span class="check-price">+700 ₴</span></div>
        </label>
        <label class="check-item" onclick="toggleCheck(this)">
            <input type="checkbox" data-price="600" data-name="Тексти">
            <div class="dot"></div>
            <div class="check-text">Копірайтинг<span class="check-price">+600 ₴</span></div>
        </label>
    </div>

    <div class="summary">
        <div class="total-val"><span id="res">2000</span> ₴</div>
        <button class="btn-action" onclick="saveData('order')">Замовити консультацію</button>
        <div style="margin-top: 15px;">
            <button class="btn-action" style="background:#f5f5f5; font-size:12px;" onclick="saveData('save')">Зберегти розрахунок</button>
        </div>
    </div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    function selectCard(el) {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        calc();
    }

    function toggleCheck(el) {
        el.classList.toggle('active');
        const input = el.querySelector('input');
        input.checked = el.classList.contains('active');
        calc();
    }

    function calc() {
        let base = parseInt(document.querySelector('.card.active').dataset.price);
        let extra = 0;
        document.querySelectorAll('.check-item.active input').forEach(c => {
            extra += parseInt(c.dataset.price);
        });
        document.getElementById('res').innerText = (base + extra).toLocaleString();
    }

    function saveData(type) {
        let service = document.querySelector('.card.active').dataset.name;
        let opts = [];
        document.querySelectorAll('.check-item.active input').forEach(c => opts.push(c.dataset.name));
        
        let result = {
            action: type === 'order' ? 'Консультація' : 'Збереження',
            project: service,
            modules: opts,
            total: document.getElementById('res').innerText + " грн"
        };
        
        // Відправляємо дані боту
        tg.sendData(JSON.stringify(result));
    }
</script>
</body>
</html>
