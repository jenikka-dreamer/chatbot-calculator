<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор чат-ботів</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#fff;color:#000;padding:16px}
h1{font-size:18px;font-weight:600;margin-bottom:4px}
.sub{font-size:13px;color:#888;margin-bottom:20px}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;color:#888;margin:20px 0 8px}
.card{background:#f4f4f4;border:2px solid transparent;border-radius:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.card.on{border-color:#1D9E75;background:#E1F5EE}
.card.on *{color:#085041}
.ch{display:flex;justify-content:space-between;align-items:center}
.ct{font-size:15px;font-weight:600}
.cp{font-size:13px;color:#888}
.cd{font-size:13px;color:#888;margin-top:4px}
.prow{display:flex;gap:8px;flex-wrap:wrap}
.pb{border:1.5px solid #ccc;background:#f4f4f4;border-radius:8px;padding:7px 16px;font-size:13px;font-weight:500;cursor:pointer}
.pb.on{border-color:#1D9E75;color:#0F6E56;background:#E1F5EE}
.eg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.ei{display:flex;align-items:center;gap:8px;background:#f4f4f4;border-radius:8px;padding:10px 12px;cursor:pointer;font-size:13px}
.ei input{width:18px;height:18px;accent-color:#1D9E75;flex-shrink:0}
.en{font-weight:500}
.ep{font-size:11px;color:#888}
.res{background:#E1F5EE;border:1.5px solid #5DCAA5;border-radius:14px;padding:16px 20px;margin-top:24px;display:none}
.rl{font-size:13px;color:#0F6E56;margin-bottom:4px}
.rp{font-size:34px;font-weight:700;color:#085041}
.bd{margin-top:14px;border-top:1px solid #9FE1CB;padding-top:10px}
.br{display:flex;justify-content:space-between;font-size:13px;color:#0F6E56;margin-bottom:5px}
.br.tot{font-weight:700;border-top:1px solid #9FE1CB;margin-top:8px;padding-top:8px}
.rn{font-size:11px;color:#0F6E56;margin-top:10px;opacity:.8}
.sb{width:100%;margin-top:14px;padding:14px;background:#1D9E75;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.rb{width:100%;margin-top:10px;padding:11px;background:transparent;color:#888;border:1.5px solid #ccc;border-radius:12px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<h1>💬 Калькулятор чат-ботів</h1>
<p class="sub">Розрахуйте вартість вашого проєкту</p>
<div class="lbl">Тип чат-бота</div>
<div id="sv"></div>
<div class="lbl">Платформа</div>
<div class="prow">
<button class="pb on" onclick="sp(this,'SendPulse')">SendPulse</button>
<button class="pb" onclick="sp(this,'ManyChat')">ManyChat</button>
<button class="pb" onclick="sp(this,'SmartSender')">SmartSender</button>
</div>
<div class="lbl">Додаткові опції</div>
<div class="eg" id="ex"></div>
<div class="res" id="res">
<div class="rl">Вартість від:</div>
<div class="rp" id="rp"></div>
<div class="bd" id="bd"></div>
<div class="rn">* Фінальна вартість уточнюється після консультації</div>
<button class="sb" onclick="send()">📩 Надіслати розрахунок</button>
</div>
<button class="rb" onclick="rst()">Скинути</button>
<script>
var tg=window.Telegram&&window.Telegram.WebApp;
if(tg)tg.expand();
var SV=[
{id:'card',name:'Бот-візитка',base:5000,desc:'Презентація вас або вашого бізнесу'},
{id:'course',name:'Бот-курс',base:5000,desc:'Навчальні матеріали, уроки, тести'},
{id:'funnel',name:'Воронка лід-магніт',base:2500,desc:'Збір лідів, прогрів, автоворонка'},
{id:'catalog',name:'Каталог',base:5000,desc:'Товари або послуги з описами та цінами'}
];
var EX=[
{id:'payment',label:'Оплата в боті',price:800},
{id:'crm',label:'Інтеграція з CRM',price:600},
{id:'miniapp',label:'Mini App',price:1500},
{id:'support',label:'Підтримка 1 місяць',price:500},
{id:'copy',label:'Написання текстів',price:700},
{id:'design',label:'Дизайн карток',price:600}
];
var sel=null,plt='SendPulse',chk={};
function rs(){
document.getElementById('sv').innerHTML=SV.map(function(s){
return '<div class="card'+(sel===s.id?' on':'')+'" onclick="ss(\''+s.id+'\')"><div class="ch"><span class="ct">'+s.name+'</span><span class="cp">від '+s.base.toLocaleString('uk-UA')+' грн</span></div><div class="cd">'+s.desc+'</div></div>';
}).join('');
}
function re(){
document.getElementById('ex').innerHTML=EX.map(function(e){
return '<label class="ei"><input type="checkbox"'+(chk[e.id]?' checked':'')+' onchange="te(\''+e.id+'\')"><div><div class="en">'+e.label+'</div><div class="ep">+'+e.price.toLocaleString('uk-UA')+' грн</div></div></label>';
}).join('');
}
function ss(id){sel=id;rs();calc();}
function sp(btn,name){
plt=name;
document.querySelectorAll('.pb').forEach(function(b){b.classList.remove('on');});
btn.classList.add('on');calc();
}
function te(id){chk[id]=!chk[id];calc();}
function calc(){
if(!sel){document.getElementById('res').style.display='none';return;}
var s=SV.find(function(x){return x.id===sel;});
var total=s.base;
var rows='<div class="br"><span>'+s.name+' ('+plt+')</span><span>від '+s.base.toLocaleString('uk-UA')+' грн</span></div>';
EX.forEach(function(e){
if(chk[e.id]){total+=e.price;rows+='<div class="br"><span>'+e.label+'</span><span>+'+e.price.toLocaleString('uk-UA')+' грн</span></div>';}
});
rows+='<div class="br tot"><span>Разом</span><span>'+total.toLocaleString('uk-UA')+' грн</span></div>';
document.getElementById('rp').textContent=total.toLocaleString('uk-UA')+' грн';
document.getElementById('bd').innerHTML=rows;
document.getElementById('res').style.display='block';
}
function send(){
if(!sel)return;
var s=SV.find(function(x){return x.id===sel;});
var total=s.base;
var text='🤖 Розрахунок чат-бота\n\nТип: '+s.name+'\nПлатформа: '+plt+'\n';
EX.forEach(function(e){if(chk[e.id]){total+=e.price;text+='+ '+e.label+': '+e.price.toLocaleString('uk-UA')+' грн\n';}});
text+='\n💰 Вартість від: '+total.toLocaleString('uk-UA')+' грн\n\n* Уточнюється після консультації';
if(tg){tg.sendData(text);}else{alert(text);}
}
function rst(){sel=null;chk={};rs();re();document.getElementById('res').style.display='none';}
rs();re();
</script>
</body>
</html>
