<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Калькулятор чат-ботів</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  background:#ffffff;
  background-image:radial-gradient(circle,#e0e0e0 1.2px,transparent 1.2px);
  background-size:20px 20px;
  color:#333;
  padding-bottom:50px;
}
.top-bar{background:#F5C842;padding:16px 18px 14px;position:sticky;top:0;z-index:10}
.top-title{font-size:17px;font-weight:700;color:#1c1200}
.top-sub{font-size:12px;color:#5a4800;margin-top:1px}
.content{padding:18px 16px 0}
.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#aaa;margin:22px 0 8px;padding-left:5px}

/* Картки ботів */
.scard{background:rgba(255,255,255,0.8);border:1.5px solid #eee;border-radius:14px;padding:15px;margin-bottom:10px;cursor:pointer;transition:0.2s}
.scard.on{border-color:#F5C842;background:#FFFDF5}
.badge-hl{display:inline-block;background:#F5C842;color:#333;font-size:9px;font-weight:800;padding:2px 7px;border-radius:10px;margin-bottom:6px;text-transform:uppercase}
.ch{display:flex;justify-content:space-between;align-items:center}
.ct{font-size:15px;font-weight:600}
.cp{font-size:13px;color:#999}
.cd{font-size:12px;color:#888;margin-top:5px;line-height:1.4}
.tip{font-size:11px;color:#7a6500;background:#FFFDF5;border:1px solid #F5C842;border-radius:8px;padding:8px;margin-top:8px}

/* Опції To-do списком */
.options-list { background:#fff; border:1.5px solid #eee; border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
.opt-row { display:flex; align-items:center; padding:14px 16px; border-bottom:1px solid #f9f9f9; cursor:pointer; }
.opt-row:last-child { border-bottom:none; }
.opt-row.on { background:#FFFDF5; }

.dot-cb { width:18px; height:18px; border-radius:50%; border:1.5px solid #ddd; margin-right:12px; display:flex; align-items:center; justify-content:center; transition:0.2s; flex-shrink:0; }
.opt-row.on .dot-cb { border-color:#F5C842; background:#F5C842; }
.opt-row.on .dot-cb::after { content:''; width:6px; height:6px; background:#1c1200; border-radius:50%; }

.opt-info { flex-grow:1; }
.opt-name { font-size:13px; font-weight:500; }
.opt-price { font-size:11px; color:#999; }

/* Результат */
.res-card { background:#fff; border:2px solid #F5C842; border-radius:16px; padding:20px; margin-top:25px; display:none; }
.res-total { font-size:32px; font-weight:800; }
.res-total span { font-size:16px; color:#999; margin-left:5px; font-weight:400; }
.res-details { margin-top:15px; border-top:1px solid #eee; padding-top:12px; }
.res-row { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; color:#666; }
.res-row.bold { font-weight:700; border-top:1px solid #eee; margin-top:8px; padding-top:8px; color:#000; }

.btn-calc { display:block; width:150px; margin:25px auto 10px; padding:12px; background:#F5C842; color:#333; border:none; border-radius:50px; font-size:14px; font-weight:700; cursor:pointer; }
.btn-save { display:block; width:100%; margin-top:15px; padding:12px; background:#1c1c1e; color:#fff; border:none; border-radius:50px; font-size:14px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-title">Калькулятор чат-ботів</div>
  <div class="top-sub">Оберіть базу та модулі для розрахунку</div>
</div>

<div class="content">
  <div class="lbl">Тип чат-бота</div>
  <div id="sv-container"></div>

  <div class="lbl">Додаткові розширення</div>
  <div class="options-list" id="ex-container"></div>

  <div class="res-card" id="res-card">
    <div style="font-size:10px; font-weight:700; color:#999; text-transform:uppercase">Попередня сума від</div>
    <div class="res-total" id="res-total">0<span>грн</span></div>
    <div class="res-details" id="res-details"></div>
    <button class="btn-save" id="saveBtn" onclick="saveToManyChat()">Зберегти розрахунок</button>
  </div>

  <button class="btn-calc" onclick="calculate()">Порахувати</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// Бот-база тепер на першому місці
const SERVICES = [
  {id:'base', name:'Бот-база', base:2000, desc:'Основа під будь-яку задачу.', tip:'Ідеально для старту: одна функція, тригер або квіз.'},
  {id:'funnel', name:'Воронка лід-магніт', base:3000, desc:'Залучення клієнтів в Instagram та перевід у Telegram.', tip:'Автоматична воронка: лід-магніт + прогрів + перехід у ТГ.'},
  {id:'card', name:'Бот-візитка', base:5000, desc:'Презентація бізнесу з описом послуг.', tip:'Повна заміна сайту всередині месенджера.'},
  {id:'course', name:'Бот-курс / Марафон', base:6000, desc:'Навчальні матеріали та домашні завдання.', tip:'Автоматична видача уроків та перевірка по кроках.'},
  {id:'shop', name:'Магазин / Каталог', base:7000, desc:'Вітрина товарів з кошиком та цінами.', tip:'Е-комерція всередині Telegram.'}
];

const EXTRAS = [
  {id:'quiz', name:'Тести / Квізи / Гейміфікація', price:2000},
  {id:'strategy', name:'Розробка стратегії', price:1500},
  {id:'pay', name:'Прийом оплат (Stripe/Mono)', price:1200},
  {id:'wfp_set', name:'Налаштування терміналу оплати', price:500},
  {id:'design', name:'Дизайн у Canva', price:700},
  {id:'copy', name:'Копірайтинг', price:600},
  {id:'google', name:'Google Таблиці', price:800}
];

let selectedId = 'base';
let selectedExtras = {};

function render() {
  document.getElementById('sv-container').innerHTML = SERVICES.map(s => `
    <div class="scard ${selectedId === s.id ? 'on' : ''}" onclick="selectS('${s.id}')">
      ${selectedId === s.id ? '<div class="badge-hl">Обрано</div>' : ''}
      <div class="ch"><span class="ct">${s.name}</span><span class="cp">від ${s.base.toLocaleString()} грн</span></div>
      <div class="cd">${s.desc}</div>
      ${selectedId === s.id ? `<div class="tip">${s.tip}</div>` : ''}
    </div>
  `).join('');

  document.getElementById('ex-container').innerHTML = EXTRAS.map(e => `
    <div class="opt-row ${selectedExtras[e.id] ? 'on' : ''}" onclick="toggleE('${e.id}')">
      <div class="dot-cb"></div>
      <div class="opt-info"><div class="opt-name">${e.name}</div><div class="opt-price">+ ${e.price.toLocaleString()} грн</div></div>
    </div>
  `).join('');
}

function selectS(id) { selectedId = id; render(); }
function toggleE(id) { selectedExtras[id] = !selectedExtras[id]; render(); }

function calculate() {
  const s = SERVICES.find(x => x.id === selectedId);
  let total = s.base;
  let rows = `<div class="res-row"><span>${s.name}</span><span>${s.base.toLocaleString()} грн</span></div>`;
  EXTRAS.forEach(e => { if(selectedExtras[e.id]) { total += e.price; rows += `<div class="res-row"><span>+ ${e.name}</span><span>${e.price.toLocaleString()} грн</span></div>`; } });
  rows += `<div class="res-row bold"><span>Разом</span><span>від ${total.toLocaleString()} грн</span></div>`;
  document.getElementById('res-total').innerHTML = total.toLocaleString() + '<span>грн</span>';
  document.getElementById('res-details').innerHTML = rows;
  document.getElementById('res-card').style.display = 'block';
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

async function saveToManyChat() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.innerText = 'Збереження...';
  
  const urlParams = new URLSearchParams(window.location.search);
  const mId = urlParams.get('m_id'); 
  const userId = mId || (tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null);

  const s = SERVICES.find(x => x.id === selectedId);
  let opts = [];
  let total = s.base;
  EXTRAS.forEach(e => { if(selectedExtras[e.id]) { total += e.price; opts.push(e.name); } });

  try {
    await fetch('/api/save', {
      method: 'POST',
      body: JSON.stringify({
        user_id: String(userId),
        project: s.name,
        options: opts,
        price: total.toLocaleString() + " грн"
      })
    });
    tg.close();
  } catch (e) {
    alert('Помилка збереження'); btn.disabled = false; btn.innerText = 'Зберегти розрахунок';
  }
}
render();
</script>
</body>
</html>
