<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Калькулятор послуг</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  background:#ffffff;
  background-image:radial-gradient(circle,#e0e0e0 1px,transparent 1px);
  background-size:22px 22px;
  color:#1c1c1e;
  padding-bottom:50px;
  -webkit-font-smoothing:antialiased;
}
.top-bar{background:#F5C842;padding:16px 18px 14px;position:sticky;top:0;z-index:10}
.top-title{font-size:17px;font-weight:700;color:#1c1200;letter-spacing:-.3px}
.top-sub{font-size:12px;color:#5a4800;margin-top:1px}

.content{padding:18px 16px 0}
.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#8e8e93;margin:20px 0 8px;padding-left:5px}

/* Картки ботів */
.scard{background:#fff;border:1.5px solid #e5e5ea;border-radius:14px;padding:15px;margin-bottom:10px;cursor:pointer;transition:all .2s ease}
.scard.on{border-color:#F5C842;background:#FFFDF5}
.badge-hl{display:inline-block;background:#F5C842;color:#3a2c00;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-bottom:6px}
.ch{display:flex;justify-content:space-between;align-items:center}
.ct{font-size:15px;font-weight:600;color:#1c1c1e}
.cp{font-size:13px;color:#8e8e93;font-weight:500}
.cd{font-size:12px;color:#8e8e93;margin-top:6px;line-height:1.4}
.tip{font-size:11px;color:#7a6500;background:#FFFDF5;border:1px solid #F5C842;border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.4}

/* Монолітний список додаткових послуг */
.options-list {
  background: #fff;
  border: 1.5px solid #e5e5ea;
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.opt-row {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid #f2f2f7;
  cursor: pointer;
}
.opt-row:last-child { border-bottom: none; }
.opt-row.on { background: #FFFDF5; }

/* Круглий чекбокс */
.dot-cb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.5px solid #d1d1d6;
  margin-right: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  background: #fff;
  flex-shrink: 0;
}
.opt-row.on .dot-cb {
  border-color: #F5C842;
  background: #F5C842;
}
.opt-row.on .dot-cb::after {
  content: '';
  width: 6px;
  height: 6px;
  background: #1c1200;
  border-radius: 50%;
}

.opt-info { flex-grow: 1; }
.opt-name { font-size: 13px; font-weight: 500; color: #1c1c1e; }
.opt-price { font-size: 11px; color: #8e8e93; margin-top: 1px; }

/* Блок підтримки */
.bonus-box{background:#FFFDF5;border:1.5px solid #F5C842;border-radius:14px;padding:15px;margin-top:10px}
.bonus-title{font-size:14px;font-weight:700;color:#1c1200}
.bonus-desc{font-size:12px;color:#7a6500;margin-top:4px;line-height:1.5}

/* Результат */
.res-card {
  background: #fff;
  border: 2px solid #F5C842;
  border-radius: 16px;
  padding: 20px;
  margin-top: 25px;
  display: none;
}
.res-total { font-size: 32px; font-weight: 800; color: #1c1c1e; letter-spacing: -1px; }
.res-total span { font-size: 16px; color: #8e8e93; margin-left: 5px; font-weight: 400; }
.res-details { margin-top: 15px; border-top: 1px solid #f2f2f7; padding-top: 12px; }
.res-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: #3a3a3c; }
.res-row.bold { font-weight: 700; border-top: 1px solid #f2f2f7; margin-top: 8px; padding-top: 8px; color:#1c1c1e; }

/* Кнопки */
.btn-calc {
  display: block; width: 160px; margin: 25px auto 10px;
  padding: 12px; background: #F5C842; color: #1c1200;
  border: none; border-radius: 50px; font-size: 14px; font-weight: 700; cursor: pointer;
}
.btn-save {
  display: block; width: 180px; margin: 15px auto 0;
  padding: 10px; background: #1c1c1e; color: #fff;
  border: none; border-radius: 50px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.btn-rst {
  display: block; margin: 15px auto; background: none; border: none;
  color: #8e8e93; font-size: 12px; cursor: pointer; text-decoration: underline;
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-title">Калькулятор чат-ботів</div>
  <div class="top-sub">Порахуйте вартість вашого проєкту онлайн</div>
</div>

<div class="content">

  <div class="lbl">Тип чат-бота</div>
  <div id="sv-container"></div>

  <div class="lbl">Додаткові модулі</div>
  <div class="options-list" id="ex-container"></div>

  <div class="lbl">Бонус — завжди включено</div>
  <div class="bonus-box">
    <div class="bonus-title">Технічна підтримка</div>
    <div class="bonus-desc">Я залишаюся з вами після здачі бота. Завжди на зв'язку — допоможу вирішити будь-яке питання.</div>
  </div>

  <div class="res-card" id="res-card">
    <div style="font-size: 10px; text-transform: uppercase; color: #8e8e93; font-weight: 700;">Попередня вартість від</div>
    <div class="res-total" id="res-total">0<span>грн</span></div>
    <div class="res-details" id="res-details"></div>
    <button class="btn-save" onclick="sendData()">Зберегти розрахунок</button>
  </div>

  <button class="btn-calc" onclick="calculate()">Порахувати</button>
  <button class="btn-rst" onclick="resetAll()">Скинути вибір</button>

</div>

<script>
const tg = window.Telegram.WebApp;
if(tg) tg.expand();

const SERVICES = [
  {id:'base', name:'Бот-база', base:2000, desc:'Фундамент під будь-яку задачу.', tip:'Основа для бота: одна функція, тригер або проста автоматизація.'},
  {id:'lm_insta', name:'Лід-магніт', base:2000, desc:'Видача подарунку через тригери в Instagram.', tip:'Людина пише коментар чи сторіз — бот миттєво надсилає матеріал у Direct.'},
  {id:'lm_funnel', name:'Лід-магнітна воронка', base:3000, desc:'Перехід з Insta в Telegram та продовження спілкування.', tip:'Залучення в Instagram та автоматичне переведення клієнта в Telegram-канал або воронку.'},
  {id:'card', name:'Бот-візитка', base:5000, desc:'Презентація бізнесу з кнопками та описом послуг.', tip:'Замінює сайт: клієнт дізнається про вас все прямо в месенджері.'},
  {id:'booking', name:'Бронювання послуг', base:5000, desc:'Автоматизація запису клієнтів на час.', tip:'Збір контактів та запис у календар або Google Таблицю.'},
  {id:'course', name:'Бот-курс / Марафон', base:6000, desc:'Навчальні матеріали та домашні завдання.', tip:'Автоматична видача уроків по кроках для експертів.'},
  {id:'shop', name:'Магазин / Каталог', base:7000, desc:'Товари або послуги з кошиком та фото.', tip:'Повноцінна вітрина з цінами та описом кожного товару.'}
];

const EXTRAS = [
  {id:'quiz', name:'Тести / Квізи / Гейміфікація', price:2000},
  {id:'strategy', name:'Розробка ідей та стратегії', price:1500},
  {id:'pay', name:'Прийом оплат (WFP/Stripe/Mono)', price:1200},
  {id:'wfp_set', name:'Налаштування кнопок оплати', price:500},
  {id:'design', name:'Дизайн у Canva', price:700},
  {id:'copy', name:'Написання текстів (копірайт)', price:600},
  {id:'google', name:'Інтеграція з Google Таблицями', price:800},
  {id:'miniapp', name:'Telegram Mini App', price:3000}
];

let selectedId = 'base';
let selectedExtras = {};

function render() {
  document.getElementById('sv-container').innerHTML = SERVICES.map(s => {
    const on = selectedId === s.id;
    return `
      <div class="scard ${on ? 'on' : ''}" onclick="selectService('${s.id}')">
        ${on ? '<div class="badge-hl">Обрано</div>' : ''}
        <div class="ch">
          <span class="ct">${s.name}</span>
          <span class="cp">від ${s.base.toLocaleString()} грн</span>
        </div>
        <div class="cd">${s.desc}</div>
        ${on ? `<div class="tip">${s.tip}</div>` : ''}
      </div>
    `;
  }).join('');

  document.getElementById('ex-container').innerHTML = EXTRAS.map(e => `
    <div class="opt-row ${selectedExtras[e.id] ? 'on' : ''}" onclick="toggleExtra('${e.id}')">
      <div class="dot-cb"></div>
      <div class="opt-info">
        <div class="opt-name">${e.name}</div>
        <div class="opt-price">+ ${e.price.toLocaleString()} грн</div>
      </div>
    </div>
  `).join('');
}

function selectService(id) { selectedId = id; render(); }
function toggleExtra(id) { selectedExtras[id] = !selectedExtras[id]; render(); }

function calculate() {
  const s = SERVICES.find(x => x.id === selectedId);
  let total = s.base;
  let rows = `<div class="res-row"><span>${s.name}</span><span>${s.base.toLocaleString()} грн</span></div>`;

  EXTRAS.forEach(e => {
    if(selectedExtras[e.id]) {
      total += e.price;
      rows += `<div class="res-row"><span>+ ${e.name}</span><span>${e.price.toLocaleString()} грн</span></div>`;
    }
  });

  rows += `<div class="res-row bold"><span>Разом</span><span>від ${total.toLocaleString()} грн</span></div>`;
  
  document.getElementById('res-total').innerHTML = total.toLocaleString() + '<span>грн</span>';
  document.getElementById('res-details').innerHTML = rows;
  document.getElementById('res-card').style.display = 'block';
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function sendData() {
  const s = SERVICES.find(x => x.id === selectedId);
  let opts = [];
  let total = s.base;
  
  EXTRAS.forEach(e => {
    if(selectedExtras[e.id]) {
      total += e.price;
      opts.push(e.name);
    }
  });

  const result = {
    project: s.name,
    modules: opts,
    total: total.toLocaleString() + " грн"
  };

  if(tg && tg.sendData) {
    tg.sendData(JSON.stringify(result));
  } else {
    alert(JSON.stringify(result));
  }
}

function resetAll() {
  selectedId = 'base';
  selectedExtras = {};
  document.getElementById('res-card').style.display = 'none';
  render();
}

render();
</script>
</body>
</html>
